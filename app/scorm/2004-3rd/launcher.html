<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading course...</title>

  <!--
    ═══════════════════════════════════════════════════════════════════
    launcher.html — SCORM 2004 3rd Edition SCO Entry Point
    ═══════════════════════════════════════════════════════════════════

    This is the file the LMS launches (referenced in imsmanifest.xml).
    DO NOT edit this file. It forwards the learner to the actual course
    content in scormcontent/index.html.

    WHY A LAUNCHER?
    ──────────────────────────────────────────────────────────────────
    Separating the core driver files from your content means you can
    freely swap the scormcontent/ folder with any custom HTML without
    ever touching the driver. The LMS injects window.API_1484_11 into
    the frame — a same-origin redirect preserves frame context so the
    SCORM API remains accessible in your content page exactly as normal.

    STRUCTURE:
    ──────────────────────────────────────────────────────────────────
      launcher.html          ← LMS opens this (DO NOT EDIT)
      core/
        scorm-driver.js      ← SCORM driver (DO NOT EDIT)
        mock-api.js          ← Local dev mock (DO NOT EDIT)
      scormcontent/
        index.html           ← Your custom HTML goes here
        (+ any other assets: CSS, images, fonts, etc.)
    ═══════════════════════════════════════════════════════════════════
  -->

  <script>
    // Forward to scormcontent/index.html.
    // The LMS injects window.API_1484_11 into this frame; a same-origin
    // redirect keeps the page in the same frame so the API stays accessible.
    window.location.replace('scormcontent/index.html');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #64748b;
    }
    p { font-size: 1rem; }
  </style>
</head>
<body>
  <p>Loading course&hellip;</p>
</body>
</html>
